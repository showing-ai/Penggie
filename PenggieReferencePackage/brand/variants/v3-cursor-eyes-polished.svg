<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Final blocky silhouette.
       Body y=22-75 (53 tall, shortened belly).
       Wings y=39-56 with eased body joints.
       Logo body corner radius unified at 0.4 for a sharper pixel silhouette.
       Feet 12×6, rx=0.4, tucked behind the body for a stronger connection. -->
  <!-- Chunky feet sit behind the body, so the body masks the top 1px -->
  <rect x="32" y="74" width="12" height="6" rx="0.4" fill="#CC6B2C"/>
  <rect x="56" y="74" width="12" height="6" rx="0.4" fill="#CC6B2C"/>
  <path d="M 20.4 22 L 79.6 22 Q 80 22 80 22.4 L 80 38.6 Q 80 39 80.4 39 L 86.6 39 Q 87 39 87 39.4 L 87 55.6 Q 87 56 86.6 56 L 80.4 56 Q 80 56 80 56.4 L 80 74.6 Q 80 75 79.6 75 L 20.4 75 Q 20 75 20 74.6 L 20 56.4 Q 20 56 19.6 56 L 13.4 56 Q 13 56 13 55.6 L 13 39.4 Q 13 39 13.4 39 L 19.6 39 Q 20 39 20 38.6 L 20 22.4 Q 20 22 20.4 22 Z" fill="#707070"/>
  <!-- Face -->
  <rect x="28" y="32" width="44" height="30" rx="0.4" fill="#FAFAF7"/>
  <!-- Sharp pixel-block eyes with terminal-style blink -->
  <rect x="36" y="38" width="6" height="9" fill="#1A1A1A">
    <animate attributeName="opacity" calcMode="discrete" values="1;0;1" keyTimes="0;0.6;1" dur="1s" repeatCount="indefinite"/>
  </rect>
  <rect x="58" y="38" width="6" height="9" fill="#1A1A1A">
    <animate attributeName="opacity" calcMode="discrete" values="1;0;1" keyTimes="0;0.6;1" dur="1s" repeatCount="indefinite"/>
  </rect>
  <!-- Sharp single-piece T-beak -->
  <path d="M 46 52 H 54 V 55 H 52 V 58 H 48 V 55 H 46 Z" fill="#CC6B2C"/>
</svg>
