<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Terminal window frame -->
  <rect x="8" y="12" width="84" height="76" rx="6" fill="none" stroke="#707070" stroke-width="2"/>
  <!-- Traffic lights -->
  <circle cx="15" cy="19" r="2" fill="#FF5F56"/>
  <circle cx="22" cy="19" r="2" fill="#FFBD2E"/>
  <circle cx="29" cy="19" r="2" fill="#27C93F"/>
  <!-- Title bar separator -->
  <line x1="8" y1="26" x2="92" y2="26" stroke="#707070" stroke-width="1" opacity="0.4"/>
  <!-- Penguin body in window -->
  <rect x="32" y="36" width="36" height="40" rx="5" fill="#707070"/>
  <!-- Face -->
  <rect x="38" y="42" width="24" height="20" rx="2" fill="white"/>
  <!-- Eyes (pixel blocks) -->
  <rect x="42" y="47" width="4" height="5" fill="#1A1A1A"/>
  <rect x="54" y="47" width="4" height="5" fill="#1A1A1A"/>
  <!-- Beak (T-shape, orange) -->
  <rect x="46" y="55" width="8" height="2" fill="#CC6B2C"/>
  <rect x="48" y="57" width="4" height="3" fill="#CC6B2C"/>
  <!-- Feet -->
  <rect x="38" y="78" width="8" height="3" rx="1" fill="#CC6B2C"/>
  <rect x="54" y="78" width="8" height="3" rx="1" fill="#CC6B2C"/>
</svg>
