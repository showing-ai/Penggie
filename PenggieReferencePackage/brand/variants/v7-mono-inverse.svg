<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark canvas background -->
  <rect x="0" y="0" width="100" height="100" rx="16" fill="#1A1A1A"/>
  <!-- Body (light gray) -->
  <rect x="22" y="22" width="56" height="56" rx="8" fill="#E8E8E8"/>
  <!-- Wings -->
  <rect x="18" y="44" width="4" height="14" rx="1" fill="#E8E8E8"/>
  <rect x="78" y="44" width="4" height="14" rx="1" fill="#E8E8E8"/>
  <!-- Face (dark window) -->
  <rect x="30" y="32" width="40" height="26" rx="3" fill="#1A1A1A"/>
  <!-- Eyes (orange highlight, terminal cursor feel) -->
  <rect x="38" y="38" width="5" height="8" fill="#CC6B2C"/>
  <rect x="57" y="38" width="5" height="8" fill="#CC6B2C"/>
  <!-- Beak (orange) -->
  <rect x="46" y="50" width="8" height="2" fill="#CC6B2C"/>
  <rect x="48" y="52" width="4" height="3" fill="#CC6B2C"/>
  <!-- Feet -->
  <rect x="34" y="80" width="10" height="3" rx="1" fill="#CC6B2C"/>
  <rect x="56" y="80" width="10" height="3" rx="1" fill="#CC6B2C"/>
</svg>
