<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Body -->
  <rect x="20" y="20" width="60" height="60" rx="8" fill="#707070"/>
  <!-- Wings -->
  <rect x="16" y="42" width="4" height="16" rx="1" fill="#707070"/>
  <rect x="80" y="42" width="4" height="16" rx="1" fill="#707070"/>
  <!-- Face -->
  <rect x="28" y="30" width="44" height="30" rx="3" fill="white"/>
  <!-- Blinking cursor block eyes -->
  <rect x="36" y="36" width="6" height="10" fill="#1A1A1A">
    <animate attributeName="opacity" values="1;1;1;0;0;1" dur="1.4s" repeatCount="indefinite"/>
  </rect>
  <rect x="58" y="36" width="6" height="10" fill="#1A1A1A">
    <animate attributeName="opacity" values="1;1;1;0;0;1" dur="1.4s" repeatCount="indefinite"/>
  </rect>
  <!-- Beak T -->
  <rect x="46" y="50" width="8" height="3" fill="#CC6B2C"/>
  <rect x="48" y="53" width="4" height="3" fill="#CC6B2C"/>
  <!-- Feet -->
  <rect x="34" y="82" width="10" height="4" rx="1" fill="#CC6B2C"/>
  <rect x="56" y="82" width="10" height="4" rx="1" fill="#CC6B2C"/>
</svg>
